<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dots → Mark morph</title>
<style>
  :root { --bg: #ffffff; }           /* frames are on white; change to #D9FCEF for the mint look */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    cursor: pointer;                  /* click anywhere to replay */
  }
  svg { width: min(92vw, 1100px); height: auto; display: block; }
  rect { stroke: #1E1E1E; stroke-width: 5; }
</style>
</head>
<body title="click to replay">
  <svg id="stage" viewBox="0 0 1728 1034" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>

<script>
(() => {
  "use strict";

  /* ---------- helpers + easing ---------- */
  const TAU = Math.PI * 2;
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = {
    linear:    t => t,
    outQuad:   t => 1 - (1 - t) * (1 - t),
    outCubic:  t => 1 - Math.pow(1 - t, 3),
    inOutCubic:t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2,
    inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
    outBack:   t => { const s = 1.70158, k = s + 1; return 1 + k*Math.pow(t-1,3) + s*Math.pow(t-1,2); },
  };

  // keyframe sampler — e is the easing used to arrive AT that keyframe
  function sample(kfs, t) {
    if (t <= kfs[0].t) return kfs[0].v;
    for (let i = 1; i < kfs.length; i++) {
      if (t <= kfs[i].t) {
        const a = kfs[i-1], b = kfs[i];
        const span = b.t - a.t;
        const local = span <= 0 ? 1 : (t - a.t) / span;
        return a.v + (b.v - a.v) * (ease[b.e] || ease.linear)(local);
      }
    }
    return kfs[kfs.length - 1].v;
  }

  /* ---------- geometry ----------
     Start: row of circles, cy 516.5, diameter 157 (r 78.5).
     End:   stadium pills 302.5 x 130.6, converged into a  > <  mark. */
  const SY = 516.5, START_D = 157, END_W = 302.5, END_H = 130.6;
  const C  = { x: 863.55, y: 517.4 };                 // centre of the final mark

  // Paint order = z-order (bottom → top): red is BEHIND blue; green above yellow.
  // si   = entrance stagger order (left → right along the start row).
  // slot = extra angle (deg) on top of the final angle, placing the four dots on a
  //        square grid during the orbit:  red (TL)  yellow (TR) / blue (BL)  green (BR).
  //        Grid corners sit at 225°/315°/135°/45°; they then rotate into formation.
  const SPEC = [
    { key:'red',    color:'#EA4335', si:1, sx:714.5,  ex:695.0,  ey:467.3, rot:-35.7, slot: 28.45 },
    { key:'blue',   color:'#4285F4', si:0, sx:415.5,  ex:695.0,  ey:567.5, rot: 35.7, slot:-28.45 },
    { key:'yellow', color:'#F9AB00', si:2, sx:1013.5, ex:1032.1, ey:567.5, rot:-35.7, slot:-61.55 },
    { key:'green',  color:'#34A853', si:3, sx:1312.5, ex:1032.1, ey:467.3, rot: 35.7, slot: 61.55 },
  ];

  /* ---------- timeline ----------
     ONE continuous flow (no stops between stages):
       • dots pop in, then spiral inward WHILE already rotating
       • carry through TURNS full revolutions in even-grid spacing
       • the spin decelerates straight into the morph — circles stretch into pills,
         break from the grid into the > < formation, stroke fades in — and settle.
     Every driver below is a single smooth (C¹) function of p, so velocity never
     drops to zero mid-animation: it eases in at the very start, out at the very end. */
  const T0 = 1.65, END = 4.55;      // spiral/orbit/morph window (bounce happens before T0)
  const TURNS = 2;                   // full revolutions (grid re-aligns each turn, in motion)
  const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
  const smoother = t => t * t * t * (t * (t * 6 - 15) + 10);   // smootherstep, flat ends

  // per-shape entrance pop (scale 0 → 1), staggered left → right
  const appearTrack = s => [
    { t:0,               v:0 },
    { t:s.si*0.06 + 0.55, v:1, e:'outBack' },
  ];

  // gentle sequential bob (a wave) in the row before the spiral — matches the reference GIF:
  // each dot does one soft rise & fall (~32 units ≈ the reference's 22px), staggered left→right
  const B_AMP = 32, B_START = 0.50, B_DUR = 0.78, B_STAG = 0.12;
  const bump = u => (u <= 0 || u >= 1) ? 0 : (1 - Math.cos(2 * Math.PI * u)) / 2;  // 0→1→0
  const bounceY = (s, t) => -B_AMP * bump((t - (B_START + s.si * B_STAG)) / B_DUR);

  /* ---------- build DOM ---------- */
  const svg = document.getElementById('stage');
  const SVGNS = 'http://www.w3.org/2000/svg';
  const shapes = SPEC.map(s => {
    const dx = s.ex - C.x, dy = s.ey - C.y;
    const baseA = Math.atan2(dy, dx);
    const rect = document.createElementNS(SVGNS, 'rect');
    rect.setAttribute('fill', s.color);
    svg.appendChild(rect);
    return { ...s, rect, baseA, slotDelta: s.slot * Math.PI / 180,
             R: Math.hypot(dx, dy), appear: appearTrack(s) };
  });

  function render(t) {
    const p     = clamp((t - T0) / (END - T0), 0, 1);
    const spin  = -TURNS * TAU * smoother(p);           // global rotation, eases in & out
    const radIn = smoother(clamp(p / 0.28, 0, 1));       // spiral onto the ring (overlaps spin)
    const arr   = smoother(clamp((p - 0.60) / 0.40, 0, 1)); // morph + break grid into formation
    const strk  = smoother(clamp((p - 0.66) / 0.34, 0, 1)); // stroke fades in with the morph

    for (const s of shapes) {
      const appear = sample(s.appear, t);                // entrance pop scale
      const w = appear * lerp(START_D, END_W, arr);
      const h = appear * lerp(START_D, END_H, arr);
      const rot = s.rot * arr;
      // angle: even-grid offset (slotDelta) fades out as it arranges; shared spin on top
      const ang = s.baseA + s.slotDelta * (1 - arr) + spin;
      const rx  = C.x + s.R * Math.cos(ang);
      const ry  = C.y + s.R * Math.sin(ang);
      const cx  = lerp(s.sx, rx, radIn);
      const cy  = lerp(SY + bounceY(s, t), ry, radIn);   // bounce in the row, then spiral away
      const el = s.rect;
      el.setAttribute('x', cx - w/2);
      el.setAttribute('y', cy - h/2);
      el.setAttribute('width', w);
      el.setAttribute('height', h);
      el.setAttribute('rx', Math.min(w, h) / 2);
      el.setAttribute('transform', `rotate(${rot} ${cx} ${cy})`);
      el.style.strokeOpacity = strk;
    }
  }

  /* ---------- clock ---------- */
  const HOLD = 2.6;                                    // extra hold on last frame (GIF loops)
  const params = new URLSearchParams(location.search);
  const LOOP = params.has('loop');
  const SEEK = params.has('t') ? parseFloat(params.get('t')) : null;
  let start = null;

  function frame(ts) {
    if (start === null) start = ts;
    let t = (ts - start) / 1000;
    if (LOOP && t > END + HOLD) { start = ts; t = 0; }
    render(Math.min(t, END));
    requestAnimationFrame(frame);
  }
  render(0);
  if (SEEK !== null) render(SEEK);                     // ?t=SEC freezes a frame for inspection
  else requestAnimationFrame(frame);

  document.body.addEventListener('click', () => { start = null; });

  // expose for deterministic frame capture (GIF export)
  window.__seek = render;
  window.__meta = { END, HOLD };
})();
</script>
</body>
</html>
