<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rolling text — reference</title>

    <!-- GSAP core + SplitText (SplitText is free from GSAP 3.13+). -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        gap: 3rem;
        align-items: center;
        justify-content: center;
        background: #0b0b0b;
        color: #f5f5f5;
        font: 600 1.75rem/1.2 system-ui, sans-serif;
      }

      /* The clipped, single-line window. Both copies of the label live here;
         only the resting one shows, the incoming one waits just below the clip.
         `align-bottom` keeps the inline box from adding descender gap. */
      .rolling {
        position: relative;
        display: inline-block;
        overflow: hidden;
        vertical-align: bottom;
        cursor: pointer;
      }
      .rolling [data-roll] {
        display: inline-block;
      }
      /* The incoming copy stacks exactly over the resting one. */
      .rolling [data-roll="bottom"] {
        position: absolute;
        left: 0;
        top: 0;
      }
    </style>
  </head>

  <body>
    <span class="rolling">
      <span data-roll="top">Get Tickets →</span>
      <span data-roll="bottom" aria-hidden="true">Get Tickets →</span>
    </span>

    <span class="rolling">
      <span data-roll="top">See Agenda →</span>
      <span data-roll="bottom" aria-hidden="true">See Agenda →</span>
    </span>

    <script>
      gsap.registerPlugin(SplitText);

      const ROLL = { duration: 0.5, ease: "power4.inOut", stagger: 0.025 };

      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      document.querySelectorAll(".rolling").forEach((root) => {
        if (reduce) return; // leave the static label alone

        const top = root.querySelector('[data-roll="top"]');
        const bottom = root.querySelector('[data-roll="bottom"]');

        // One character per <div> so they can stagger independently.
        const splitTop = new SplitText(top, { type: "chars" });
        const splitBottom = new SplitText(bottom, { type: "chars" });

        // The clone waits one full line below, ready to roll up into place.
        gsap.set(splitBottom.chars, { yPercent: 100 });

        // Built paused, then played once forward on enter and reversed on
        // leave — so a hover is one roll, never a loop.
        const tl = gsap
          .timeline({ paused: true })
          .to(splitTop.chars, { yPercent: -100, ...ROLL }, 0)
          .to(splitBottom.chars, { yPercent: 0, ...ROLL }, 0);

        root.addEventListener("mouseenter", () => tl.play());
        root.addEventListener("mouseleave", () => tl.reverse());
      });
    </script>
  </body>
</html>
